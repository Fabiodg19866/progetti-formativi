
<label style="margin-left:1%;margin-top:2%;">Server Name</label>
 
<input type="text" class="col-xs-3" [(ngModel)] ="serverName" >

  <p>{{ serverName }}</p>
 
<button
  class="btn btn-primary"
  [disabled]="!allowNewServer"
  (click)="onCreateServer()">Add Server</button>

<p style="margin-left:1%;float:left;">{{ serverCreationStatus }}</p>
