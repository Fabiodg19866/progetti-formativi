
<button class="btn btn-primary" (click)="onToggleDetails()" style="margin-left:1%;margin-top:2%;">Display Details</button>
      <p style="margin-top: 2%;margin-left:2%;" *ngIf="showSecret">Secret Password = tuna</p>
      <div style="margin-left:2%;"

        [ngStyle]="{backgroundColor: i >= 4 ? 'blue' : 'yellow'}"

      >{{ logItem }}</div>
