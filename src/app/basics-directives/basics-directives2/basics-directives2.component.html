<label style="margin-right: 1%;margin-top:2%;">Server Name</label>

<input
  type="text"
  class="col-xs-3" 
  [(ngModel)]="serverName">

<button
  class="btn btn-primary"
  style="float:inline-end;margin-left:1%;"
  [disabled]="!allowNewServer"
  (click)="onCreateServer()">Add Server</button>
  <hr>

<p style="margin-top: 2%;" *ngIf="serverCreated">Server was created, server name is {{ serverName }}</p>
<app-basics-directives1 *ngFor="let server of servers"></app-basics-directives1>
