
 <button class="btn btn-primary" (click)="onToggleDetails()" style="margin-top:2%;margin-left:1%;">Display Details</button>
 <p style="margin-top:2%;margin-left:2%;" *ngIf="showSecret">Secret Password = tuna</p>
 <div style="margin-left:2%;"

 >{{ logItem }}</div>
