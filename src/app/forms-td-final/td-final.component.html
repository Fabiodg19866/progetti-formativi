<div class="container">
  <div class="row">
    <div class="col-xs-12 col-sm-10 col-md-8 col-sm-offset-1 col-md-offset-2">
      <form (ngSubmit)="onSubmit()" #f="ngForm">
        <div
          id="user-data"
          ngModelGroup="userData"
          #userData="ngModelGroup">
          <div class="form-group">
            <label for="username">Username:</label>

            <input
              type="text"
              id="username"
              style="margin-left:2%;"
              class="col-xs-12"
              ngModel
              name="username"
              required>
          </div>
          <button
            style="margin-top:2%;margin-bottom:2%;"
            class="btn btn-default"
            type="button"
            (click)="suggestUserName()">Suggest an Username</button>
          <div class="form-group">
            <label style="margin-top:3%;margin-right:2%;" for="email">Mail:</label>
            <input
              type="email"
              id="email"
              class="col-xs-12"
              ngModel
              name="email"
              required
              email
              #email="ngModel">
          </div>
        </div>
        <p style="color: red;margin-top:2%;" *ngIf="!userData.valid && userData.touched">Please enter a valid email!</p>
        <div class="form-group">
          <label style="margin-top:2%;" for="secret">Secret Questions</label>
          <select
            style="margin-top:2%;margin-left:2%;"
            id="secret"
            class="form-control"
            [ngModel]="defaultQuestion"
            name="secret">
            <option value="pet">Your first Pet?</option>
            <option value="teacher">Your first teacher?</option>
          </select>
        </div>
        <div style="margin-top:2%;" class="form-group">
          <textarea
            name="questionAnswer"
            rows="3"
            class="form-control"
            [(ngModel)]="answer"></textarea>
        </div>
        <p style="margin-top: 2%;">Your reply: {{ answer }}</p>
        <div class="radio" *ngFor="let gender of genders">
          <label>
            <input
              type="radio"
              name="gender"
              ngModel
              [value]="gender"
              required>
            {{ gender }}
          </label>
        </div>
        <button
          style="margin-top:2%;"
          class="btn btn-primary"
          type="submit"
          [disabled]="!f.valid">Submit</button>
      </form>
    </div>
  </div>
  <hr>
  <div class="row" *ngIf="submitted">
    <div class="col-xs-12">
      <h3>Your Data</h3>
      <p>Username: {{ user.username }}</p>
      <p>Mail: {{ user.email }}</p>
      <p>Secret Question: Your first {{ user.secretQuestion }}</p>
      <p>Answer: {{ user.answer }}</p>
      <p>Gender: {{ user.gender }}</p>
    </div>
  </div>
</div>
